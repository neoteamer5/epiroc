# =============================================================================
# Azure DevOps CI / PR Validation Pipeline
#
# Project: CoolingLoopControlSystem
#
# Purpose:
#   1. Configure the CMake project
#   2. Build the software
#   3. Run automated tests
#   4. Publish test results
#   5. Publish build output as an Azure Pipeline Artifact
#
# PR validation:
#   Repos -> Branches -> main -> Branch policies -> Build validation
# =============================================================================

name: $(Date:yyyyMMdd).$(Rev:r)

# -----------------------------------------------------------------------------
# CI Trigger
# -----------------------------------------------------------------------------
# Run automatically when code is pushed/merged to main.
#
# Azure Repos PR validation is configured separately using the
# Build Validation branch policy.
# -----------------------------------------------------------------------------
trigger:
  branches:
    include:
      - main

# -----------------------------------------------------------------------------
# Microsoft-hosted build agent
# -----------------------------------------------------------------------------
pool:
  vmImage: ubuntu-24.04

# -----------------------------------------------------------------------------
# Pipeline variables
# -----------------------------------------------------------------------------
variables:
  buildType: 'Debug'
  buildDirectory: '$(Build.SourcesDirectory)/build'
  artifactDirectory: '$(Build.ArtifactStagingDirectory)/firmware'

# =============================================================================
# Build and Test Stage
# =============================================================================
stages:

- stage: BuildAndTest
  displayName: Build, Test and Publish

  jobs:

  - job: LinuxBuild
    displayName: Linux C++ Build

    timeoutInMinutes: 20

    steps:

    # -------------------------------------------------------------------------
    # Checkout
    # -------------------------------------------------------------------------
    - checkout: self
      clean: true
      fetchDepth: 1
      displayName: Checkout source code

    # -------------------------------------------------------------------------
    # Install build dependencies
    # -------------------------------------------------------------------------
    - script: |
        sudo apt-get update

        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          pkg-config \
          libgtest-dev \
          libxkbcommon-dev \
          qt6-base-dev \
          qt6-declarative-dev \
          qt6-base-dev-tools \
          qt6-declarative-dev-tools \
          qt6-base-private-dev \
          qt6-declarative-private-dev

      displayName: 'Install build dependencies'

    # -------------------------------------------------------------------------
    # Display tool versions
    # -------------------------------------------------------------------------
    - bash: |
        set -euo pipefail

        echo "Compiler:"
        g++ --version

        echo
        echo "CMake:"
        cmake --version

        echo
        echo "Ninja:"
        ninja --version

        echo
        echo "Qt:"
        qmake6 --version

        echo
        echo "Qt installation:"
        dpkg -l | grep -E 'qt6-(base|declarative)' || true

      displayName: Display build environment

    # -------------------------------------------------------------------------
    # Configure
    # -------------------------------------------------------------------------
    - bash: |
        set -euo pipefail

        cmake \
          -S "$(Build.SourcesDirectory)" \
          -B "$(buildDirectory)" \
          -G Ninja \
          -DCMAKE_BUILD_TYPE="$(buildType)" \
          -DBUILD_TESTING=ON

      displayName: Configure CMake

    # -------------------------------------------------------------------------
    # Build
    # -------------------------------------------------------------------------
    - bash: |
        set -euo pipefail

        cmake \
          --build "$(buildDirectory)" \
          --parallel

      displayName: Build project

    # -------------------------------------------------------------------------
    # Run tests
    # -------------------------------------------------------------------------
    - bash: |
        set -euo pipefail

        ctest \
          --test-dir "$(buildDirectory)" \
          --build-config "$(buildType)" \
          --output-on-failure \
          --output-junit "$(buildDirectory)/test-results.xml"

      displayName: Run unit tests

    # -------------------------------------------------------------------------
    # Publish unit-test results
    # -------------------------------------------------------------------------
    # This runs even when a test fails so Azure DevOps can display the
    # failing test details.
    # -------------------------------------------------------------------------
    - task: PublishTestResults@2
      displayName: Publish test results
      condition: succeededOrFailed()

      inputs:
        testResultsFormat: JUnit
        testResultsFiles: '$(buildDirectory)/test-results.xml'
        testRunTitle: 'CoolingLoopControlSystem - Linux'
        failTaskOnFailedTests: true
        failTaskOnMissingResultsFile: true

    # -------------------------------------------------------------------------
    # Stage build artifacts
    # -------------------------------------------------------------------------
    # Copy only files that should be retained after the hosted build agent
    # is destroyed.
    #
    # Adjust the source directory if your CMake binaries are located
    # somewhere other than build/bin.
    # -------------------------------------------------------------------------
    - bash: |
        set -euo pipefail

        echo "Creating artifact staging directory..."
        mkdir -p "$(artifactDirectory)"

        echo "Build outputs:"
        find "$(buildDirectory)" \
          -type f \
          \( -name "*.bin" \
             -o -name "*.hex" \
             -o -name "*.elf" \) \
          -print

        echo "Copying firmware files..."

        find "$(buildDirectory)" \
          -type f \
          \( -name "*.bin" \
             -o -name "*.hex" \
             -o -name "*.elf" \) \
          -exec cp {} "$(artifactDirectory)/" \;

        echo
        echo "Artifact contents:"
        ls -lh "$(artifactDirectory)"

      displayName: Stage firmware artifacts

    # -------------------------------------------------------------------------
    # Publish artifact to Azure DevOps
    # -------------------------------------------------------------------------
    # The artifact is retained by Azure DevOps and associated with this
    # particular pipeline run.
    # -------------------------------------------------------------------------
    - task: PublishPipelineArtifact@1
      displayName: Publish firmware artifact

      inputs:
        targetPath: '$(artifactDirectory)'
        artifact: 'firmware'
        publishLocation: 'pipeline'