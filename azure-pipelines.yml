# =============================================================================
# Azure DevOps CI / PR Validation Pipeline
#
# Project: CoolingLoopControlSystem
#
# Purpose:
#   - Configure the CMake project
#   - Build all configured targets
#   - Run automated tests through CTest
#   - Publish test results to Azure DevOps
#
# Pull requests targeting main are validated through:
#   Repos -> Branches -> main -> Branch policies -> Build validation
#
# Note:
#   Azure Repos PR validation is configured by branch policy, not by a
#   YAML "pr:" trigger.
# =============================================================================

name: $(Date:yyyyMMdd).$(Rev:r)

# -----------------------------------------------------------------------------
# Continuous Integration
# -----------------------------------------------------------------------------
# Run CI after changes are merged/pushed to main.
# PR validation is configured separately through the main branch policy.
trigger:
  branches:
    include:
      - main

# -----------------------------------------------------------------------------
# Agent
# -----------------------------------------------------------------------------
# Pin the OS version instead of depending on a future change to ubuntu-latest.
pool:
  vmImage: ubuntu-24.04

# -----------------------------------------------------------------------------
# Common variables
# -----------------------------------------------------------------------------
variables:
  buildDirectory: '$(Build.SourcesDirectory)/build'
  buildType: 'Debug'

stages:

# =============================================================================
# Build and Test
# =============================================================================
- stage: BuildAndTest
  displayName: Build and Test

  jobs:
  - job: LinuxBuild
    displayName: Linux C++ Build

    timeoutInMinutes: 20

    steps:

    # -------------------------------------------------------------------------
    # Checkout
    # -------------------------------------------------------------------------
    - checkout: self
      clean: true
      fetchDepth: 1
      displayName: Checkout source code

    # -------------------------------------------------------------------------
    # Install dependencies
    # -------------------------------------------------------------------------
    - bash: |
        set -euo pipefail

        sudo apt-get update

        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          libgtest-dev
      displayName: Install build dependencies

    # -------------------------------------------------------------------------
    # Show tool versions
    # -------------------------------------------------------------------------
    - bash: |
        set -euo pipefail

        echo "Compiler:"
        g++ --version

        echo
        echo "CMake:"
        cmake --version

        echo
        echo "Ninja:"
        ninja --version
      displayName: Display build environment

    # -------------------------------------------------------------------------
    # Configure
    # -------------------------------------------------------------------------
    - bash: |
        set -euo pipefail

        cmake \
          -S "$(Build.SourcesDirectory)" \
          -B "$(buildDirectory)" \
          -G Ninja \
          -DCMAKE_BUILD_TYPE="$(buildType)" \
          -DBUILD_TESTING=ON
      displayName: Configure CMake

    # -------------------------------------------------------------------------
    # Build
    # -------------------------------------------------------------------------
    - bash: |
        set -euo pipefail

        cmake \
          --build "$(buildDirectory)" \
          --parallel
      displayName: Build project

    # -------------------------------------------------------------------------
    # Test
    # -------------------------------------------------------------------------
    - bash: |
        set -euo pipefail

        ctest \
          --test-dir "$(buildDirectory)" \
          --build-config "$(buildType)" \
          --output-on-failure \
          --output-junit "$(buildDirectory)/test-results.xml"
      displayName: Run unit tests

    # -------------------------------------------------------------------------
    # Publish test results
    # -------------------------------------------------------------------------
    # succeededOrFailed() means the test report is uploaded even when a test
    # fails, so the failure details are visible in the Azure DevOps Tests tab.
    - task: PublishTestResults@2
      displayName: Publish test results
      condition: succeededOrFailed()

      inputs:
        testResultsFormat: JUnit
        testResultsFiles: '$(buildDirectory)/test-results.xml'
        testRunTitle: 'CoolingLoopControlSystem - Linux'
        failTaskOnFailedTests: true
        failTaskOnMissingResultsFile: true