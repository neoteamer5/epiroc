<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="300" viewBox="0 0 300 300"
     xmlns="http://www.w3.org/2000/svg">

  <circle cx="150" cy="150" r="140" stroke="black" stroke-width="6" fill="#111"/>

  <g stroke="white" stroke-width="4">
    <line x1="150" y1="20" x2="150" y2="40"/>
    <line x1="210" y1="40" x2="200" y2="60"/>
    <line x1="255" y1="85" x2="235" y2="100"/>
    <line x1="280" y1="150" x2="260" y2="150"/>
